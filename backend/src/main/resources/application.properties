# Server Configuration
server.port=8080

# MySQL Database Configuration
# IMPORTANT: Set these via environment variables for security:
# export DB_USERNAME=your_username
# export DB_PASSWORD=your_secure_password
# The default values below are for local development only!
spring.datasource.url=jdbc:mysql://localhost:3306/nthe_customer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
# IMPORTANT: For production, set this to your specific frontend domain:
# export CORS_ALLOWED_ORIGINS=https://your-frontend-domain.com
# The wildcard (*) is for local development only!
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Application Name
spring.application.name=customer-management
